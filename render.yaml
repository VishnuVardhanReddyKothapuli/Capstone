services:
  # 1. Backend Web Service
  - type: web
    name: sentinal-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free # Note: ML models might exceed the 512MB RAM limit on the free tier
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sentinal-db
          property: connectionString
      - key: CHROMA_PERSIST_DIR
        value: /app/chroma_db # Free tier does not support persistent disks, this will reset on deploy
      - key: FRONTEND_DIST
        value: "" # We don't need the backend to serve the frontend
      - key: CORS_ORIGINS
        value: "https://sentinal-frontend.onrender.com" # Update this to your final frontend URL
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

  # 2. Frontend Static Site
  - type: web
    name: sentinal-frontend
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist" # Vite outputs to dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_URL
        value: "https://sentinal-backend.onrender.com" # Must match the backend service URL

# 3. Database Service
databases:
  - name: sentinal-db
    databaseName: sentinal
    user: sentinal
    plan: free # Change this to a paid plan for production
