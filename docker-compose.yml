version: '3.8'

services:
  sentinal:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinal-app:latest
    container_name: sentinal-app
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      # Persist SQLite database and ChromaDB vectors outside the container
      - ./backend/sentinal.db:/app/backend/sentinal.db
      - ./backend/chroma_db:/app/backend/chroma_db
    restart: unless-stopped
    # Depending on your environment, you may want to uncomment the below 
    # to limit memory usage, as ML models can be hungry:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
